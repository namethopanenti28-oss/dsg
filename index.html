<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Brand Buttons</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff2f92 0%, #ff8c1a 100%);
    }

    .partners {
      text-align: center;
      padding: 50px 20px;
    }

    .partners h2 {
      font-size: 36px;
      margin-bottom: 40px;
      color: #fff;
    }

    .partners-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    /* BUTTON ADAPTS TO IMAGE SIZE */
    .partner-card {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      background: transparent;
      text-decoration: none;
      width: fit-content;
      height: fit-content;
      transition: 0.3s ease;
    }

    .partner-card img {
      display: block;
      width: auto;
      height: auto;
      max-width: 220px;
      max-height: 120px;
      object-fit: contain;
    }

    .partner-card:hover {
      transform: translateY(-5px);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
  </style>
</head>

<body>

<section class="partners">
  <h2>Brands We Offer</h2>

  <div class="partners-grid">

    <a href="https://new.abb.com/" target="_blank" class="partner-card">
      <img src="abb.jpg" alt="ABB">
    </a>

    <a href="https://www.panasonic.com/in/" target="_blank" class="partner-card">
      <img src="anchor.jpg" alt="Anchor Panasonic">
    </a>

    <a href="https://bentecindia.com/" target="_blank" class="partner-card">
      <img src="bentechbenlo.jpg" alt="Bentech">
    </a>

    <a href="https://www.salzerindia.com/" target="_blank" class="partner-card">
      <img src="salzer.jpg" alt="Salzer">
    </a>

  </div>
</section>

</body>
</html>
